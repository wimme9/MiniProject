<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- ฉาก 1: เมนู -->
    <div id="scene-menu" class="scene">
      <h1 id="game-title">Tiny Runner</h1>
      <p class="tagline">วิ่งอัตโนมัติ หลบสิ่งกีดขวาง กระโดดข้ามหลุม เก็บเหรียญให้ได้คะแนนมากที่สุด!</p>
      <div class="controls">
        <p><kbd>Space</kbd> / <kbd>↑</kbd> — กระโดด</p>
        <p><kbd>S<  /kbd> / <kbd>↓</kbd> — สไลด์</p>
      </div>
      <button id="btn-start" class="btn primary">▶ Start</button>
      <p class="hs">🏆 คะแนนสูงสุด: <span id="menu-highscore">0</span></p>
    </div>

    <!-- ฉาก 3: Game Over -->
    <div id="scene-gameover" class="scene hidden">
      <h2>💀 Game Over</h2>
      <p class="stat">คะแนน: <span id="final-score">0</span></p>
      <p class="stat">ระยะทาง: <span id="final-distance">0</span></p>
      <p class="stat">🏆 คะแนนสูงสุด: <span id="final-highscore">0</span></p>
      <p id="new-record" class="new-record hidden">🎉 สถิติใหม่!</p>
      <button id="btn-replay" class="btn primary">↻ Replay</button>
      <button id="btn-menu" class="btn secondary">เมนูหลัก</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="player.js"></script>
  <script src="entities.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
